name: Android CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests include the architecture, privacy and data invariant checks.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Installable on a phone. Note: CI signs with its own debug key, so it
      # cannot update an install that was built on another machine (uninstall first).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-blocker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
